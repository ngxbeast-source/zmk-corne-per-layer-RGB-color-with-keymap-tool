	@media (max-width: 700px) {

<div class="section">
	<h2>Paste Your Existing ZMK Code</h2>
	<textarea id="userCodePaste" style="width:100%;height:120px;font-family:monospace;" placeholder="Paste your macros, behaviors, combos, etc. here..."></textarea>
	<button id="parseBtn">Parse & Reflect</button>

<div class="section">
	<h2>Layer & Color</h2>
	<div class="input-row">

		<input type="number" id="hueNum" min="0" max="360" value="0" style="width:50px;">
		<label for="sat">S:</label>
		<input type="range" id="sat" min="0" max="100" value="100">
		<input type="number" id="satNum" min="0" max="100" value="100" style="width:50px;">
		<label for="bri">B:</label>
		<input type="range" id="bri" min="0" max="100" value="50">

	<div class="input-row">
		<label for="behaviorName">Name:</label>
		<input type="text" id="behaviorName" placeholder="behavior_name">
		<label for="behaviorLabel">Label:</label>
		<input type="text" id="behaviorLabel" placeholder="Label">
		<label for="behaviorMacro">Macro Ref:</label>
		<select id="behaviorMacro"></select>
		<button id="addBehaviorBtn">Add Behavior</button>
	</div>

</div>
<div class="section">
	<h2>Combos</h2>
	<div class="input-row">
		<label for="comboName">Name:</label>
		<input type="text" id="comboName" placeholder="combo_name">
		<label for="comboBind">Bind:</label>
		<input type="text" id="comboBind" placeholder="&kp ESC">
		<label for="comboPos">Pos:</label>
		<input type="text" id="comboPos" placeholder="0">
		<label for="comboLayers">Layers:</label>
		<select id="comboLayers" multiple style="min-width:100px;"></select>

</div>
<div class="section">
	<h2>Blink/Status Macros</h2>
	<div class="input-row">
		<label for="blinkName">Name:</label>
		<input type="text" id="blinkName" placeholder="blink_macro">
		<label for="blinkKey">Key:</label>
		<input type="text" id="blinkKey" placeholder="CAPS">
		<label for="blinkColor">Color:</label>
		<select id="blinkColor"></select>
		<label for="blinkReturnColor">Return Color:</label>
		<select id="blinkReturnColor"></select>
		<label for="blinkWait">Wait:</label>
		<input type="number" id="blinkWait" value="80" min="0" style="width:60px;">
		<button id="addBlinkMacroBtn">Add Blink Macro</button>
	</div>

</div>
<div class="section">
	<h2>Helpers & Output</h2>
	<button id="copyOutputBtn">Copy Output</button>
	<textarea id="output" readonly></textarea>
</div>
<script>
// --- Data ---
let layers = [];
let macros = [];
let behaviors = [];
let combos = [];
let blinkMacros = [];
let colorValueMap = {};
let colorLabelMap = {};

// --- Utility ---
function hsbToHex(h,s,b) {
	s = s/100; b = b/100;
	let k = n => (n + h/60) % 6;
	let f = n => b - b * s * Math.max(Math.min(k(n),4-k(n),1),0);
	let r = Math.round(255*f(5)), g = Math.round(255*f(3)), bl = Math.round(255*f(1));
	return `#${((1<<24)+(r<<16)+(g<<8)+bl).toString(16).slice(1)}`;
}

// --- Parsing ---
function parseUserCode() {
	const code = document.getElementById('userCodePaste').value;
	// Reset all
	layers = [];
	macros = [];
	behaviors = [];
	combos = [];
	blinkMacros = [];
	// Parse layers: prefer only #define LAYER_* unless none exist
	let m;
	let layerRegex = /^#define\s+(LAYER_[A-Za-z0-9_]+)\s+(\d+)$/gm;
	let foundLayerPrefix = false;
	let tempLayers = [];
	// Parse all RGB_ color definitions and their comments/labels into a color map
	colorLabelMap = {};
	colorValueMap = {};
	// Match any #define <NAME> RGB_COLOR_HSB(...)
	const colorCommentRegex = /^#define\s+([A-Za-z0-9_]+)\s+RGB_COLOR_HSB\((\d+),(\d+),(\d+)\)\s*(\/\*([^*]*)\*\/)?\s*(\/\/([^\n]*))?/gm;
	let c;
	while ((c = colorCommentRegex.exec(code))) {
		let h = parseInt(c[2]), s = parseInt(c[3]), b = parseInt(c[4]);
		if (h === 0 && s === 0 && b === 0) continue; // skip black/empty colors
		let label = (c[6] ? c[6].trim() : '') || (c[8] ? c[8].trim() : '');
		colorLabelMap[c[1]] = label;
		colorValueMap[c[1]] = { h, s, b };
	}
	while ((m = layerRegex.exec(code))) {
		foundLayerPrefix = true;
		let colorKeyStripped = m[1].replace('LAYER_','');
		let colorKeyFull = m[1];
		let colorMatch = colorValueMap[colorKeyStripped] || colorValueMap[colorKeyFull];
		let label = colorLabelMap[colorKeyStripped] || colorLabelMap[colorKeyFull] || '';
		if (colorMatch) {
			tempLayers.push({ name: m[1], index: m[2], h: colorMatch.h, s: colorMatch.s, b: colorMatch.b, label });
		} else {
			tempLayers.push({ name: m[1], index: m[2], h: '', s: '', b: '', label });
		}
	}
	if (foundLayerPrefix) {
		layers = tempLayers;
	} else {
		// fallback: parse all #define <NAME> <num>
		layerRegex = /^#define\s+([A-Za-z0-9_]+)\s+(\d+)$/gm;
		while ((m = layerRegex.exec(code))) {
			let colorKey = m[1];
			let colorMatch = colorValueMap[colorKey];
			let label = colorLabelMap[colorKey] || '';
			if (colorMatch) {
				layers.push({ name: m[1], index: m[2], h: colorMatch.h, s: colorMatch.s, b: colorMatch.b, label });
			} else {
				layers.push({ name: m[1], index: m[2], h: '', s: '', b: '', label });
			}
		}
	}
	// Add any RGB_ colors not already in layers
	Object.keys(colorValueMap).forEach(colorKey => {
		if (!layers.some(l => l.name.replace('LAYER_','') === colorKey)) {
			let v = colorValueMap[colorKey];
			let label = colorLabelMap[colorKey] || '';
			layers.push({ name: colorKey, index: '', h: v.h, s: v.s, b: v.b, label });
		}
	});
	// Parse macros
	const macroRegex = /(TO_RGB_MACRO|MOMENTARY_RGB_MACRO|TO_RGB_PRESS_MACRO)\(([^\)]+)\)/g;
	while ((m = macroRegex.exec(code))) {
		const args = m[2].split(',').map(x=>x.trim());
		if (m[1]==='TO_RGB_MACRO') {
			macros.push({ name: args[0], type: m[1], layer: args[2], color: args[3], releaseColor: '' });
		} else if (m[1]==='MOMENTARY_RGB_MACRO') {
			macros.push({ name: args[0], type: m[1], layer: args[2], color: args[3], releaseColor: args[4] });
		} else if (m[1]==='TO_RGB_PRESS_MACRO') {
			macros.push({ name: args[0], type: m[1], layer: args[2], color: args[3], releaseColor: '' });
		}
	}
	// Parse behaviors
	const behRegex = /RGB_HOLD_TAP\(([^\)]+)\)/g;
	while ((m = behRegex.exec(code))) {
		const args = m[1].split(',').map(x=>x.trim());
		behaviors.push({ name: args[0], label: args[1].replace(/"/g,''), macro: args[2] });
	}
	// Parse combos
	const comboRegex = /COMBO\(([^\)]*)\)/g;
	while ((m = comboRegex.exec(code))) {
		const args = m[1].split(',').map(x=>x.trim());
		let pos = args[2];
		if (args.length > 3 && /^\d+$/.test(args[3])) {
			pos = args[2] + ',' + args[3];
			combos.push({ name: args[0], bind: args[1], pos, layers: args.slice(4).join(' ') });
		} else {
			combos.push({ name: args[0], bind: args[1], pos, layers: args.slice(3).join(' ') });
		}
	}
	// Parse blink macros
	const blinkRegex = /ZMK_MACRO\(([^\)]+BLINK_SEQ[^\)]*)\)/g;
	while ((m = blinkRegex.exec(code))) {
		const macroStr = m[1];
		const name = macroStr.split(',')[0].trim();
		let key = '';
		let color = '', returnColor = '', wait = 80;
		const kpMatch = macroStr.match(/&kp\s+([A-Za-z0-9_]+)/);
		if (kpMatch) key = kpMatch[1];
		const blinkSeqMatch = macroStr.match(/BLINK_SEQ\(([^\)]+)\)/);
		if (blinkSeqMatch) {
			const blinkArgs = blinkSeqMatch[1].split(',').map(x=>x.trim());
			color = blinkArgs[0];
			returnColor = blinkArgs[1];
			wait = parseInt(blinkArgs[2])||80;
		}
		blinkMacros.push({ name, key, color, returnColor, wait });
	}
	document.getElementById('userCodeStatus').style.display = 'inline';
	setTimeout(()=>{document.getElementById('userCodeStatus').style.display='none';},2000);
	renderAll();
	// Ensure global access for inline event handlers and DOM onclick
	window.parseUserCode = parseUserCode;
	window.addLayer = addLayer;
	window.removeLayer = removeLayer;
	window.addMacro = addMacro;
	window.removeMacro = removeMacro;
	window.addBehavior = addBehavior;
	window.removeBehavior = removeBehavior;
	window.addCombo = addCombo;
	window.removeCombo = removeCombo;
	window.addBlinkMacro = addBlinkMacro;
	window.removeBlinkMacro = removeBlinkMacro;
}

// --- UI Renderers ---
function renderAll() {
	renderLayerList();
	renderMacroList();
	renderBehaviorList();
	renderComboList();
	renderBlinkMacroList();
	updateDropdowns();
	updateOutput();
	attachDynamicHandlers();
}

// Attach all dynamic event handlers after rendering
function attachDynamicHandlers() {
	// Layer list
	document.querySelectorAll('#layerList .item').forEach((div, i) => {
		div.querySelector('input[type="number"]').addEventListener('input', e => {
			layers[i].index = e.target.value;
			updateColorMapFromLayer(i);
			updateOutput();
		});
		const h = div.querySelectorAll('input[type="number"]')[1];
		h.addEventListener('input', e => { layers[i].h = e.target.value; updateColorMapFromLayer(i); updateOutput(); updateColorPreview(e.target,i); });
		const s = div.querySelectorAll('input[type="number"]')[2];
	s.addEventListener('input', e => { layers[i].s = e.target.value; updateColorMapFromLayer(i); updateOutput(); updateColorPreview(e.target,i); });
		const b = div.querySelectorAll('input[type="number"]')[3];
	b.addEventListener('input', e => { layers[i].b = e.target.value; updateColorMapFromLayer(i); updateOutput(); updateColorPreview(e.target,i); });
		const label = div.querySelector('input[type="text"]');
		label.addEventListener('input', e => { layers[i].label = e.target.value; updateColorMapFromLayer(i); updateOutput(); });
		div.querySelector('button').addEventListener('click', () => { removeLayer(i); });
	});
	// Macro list
	document.querySelectorAll('#macroList .item').forEach((div, i) => {
		const inputs = div.querySelectorAll('input');
		inputs[0].addEventListener('input', e => { macros[i].layer = e.target.value; updateOutput(); });
		inputs[1].addEventListener('input', e => { macros[i].color = e.target.value; updateOutput(); });
		if (inputs[2]) inputs[2].addEventListener('input', e => { macros[i].releaseColor = e.target.value; updateOutput(); });
		div.querySelector('button').addEventListener('click', () => { removeMacro(i); });
	});
	// Behavior list
	document.querySelectorAll('#behaviorList .item').forEach((div, i) => {
		const inputs = div.querySelectorAll('input');
		inputs[0].addEventListener('input', e => { behaviors[i].label = e.target.value; updateOutput(); });
		inputs[1].addEventListener('input', e => { behaviors[i].macro = e.target.value; updateOutput(); });
		div.querySelector('button').addEventListener('click', () => { removeBehavior(i); });
	});
	// Combo list
	document.querySelectorAll('#comboList .item').forEach((div, i) => {
		const inputs = div.querySelectorAll('input');
		inputs[0].addEventListener('input', e => { combos[i].bind = e.target.value; updateOutput(); });
		inputs[1].addEventListener('input', e => { combos[i].pos = e.target.value; updateOutput(); });
		inputs[2].addEventListener('input', e => { combos[i].layers = e.target.value; updateOutput(); });
		div.querySelector('button').addEventListener('click', () => { removeCombo(i); });
	});
	// Blink macro list
	document.querySelectorAll('#blinkMacroList .item').forEach((div, i) => {
		const inputs = div.querySelectorAll('input');
		inputs[0].addEventListener('input', e => { blinkMacros[i].key = e.target.value; updateOutput(); });
		inputs[1].addEventListener('input', e => { blinkMacros[i].color = e.target.value; updateOutput(); });
		inputs[2].addEventListener('input', e => { blinkMacros[i].returnColor = e.target.value; updateOutput(); });
		inputs[3].addEventListener('input', e => { blinkMacros[i].wait = e.target.value; updateOutput(); });
		div.querySelector('button').addEventListener('click', () => { removeBlinkMacro(i); });
	});
}

function renderLayerList() {
	const list = document.getElementById('layerList');
	list.innerHTML = '';
	layers.forEach((l, i) => {
		const div = document.createElement('div');
		div.className = 'item';
		div.innerHTML = `
			<b>${l.name}</b> (Index: <input type="number" value="${l.index}" min="0" style="width:50px;" onchange="layers[${i}].index=this.value;updateColorMapFromLayer(${i});updateOutput()">)
			H: <input type="number" min="0" max="360" value="${l.h}" style="width:50px;" onchange="layers[${i}].h=this.value;updateColorMapFromLayer(${i});updateOutput();updateColorPreview(this,${i})">
			S: <input type="number" min="0" max="100" value="${l.s}" style="width:50px;" onchange="layers[${i}].s=this.value;updateColorMapFromLayer(${i});updateOutput();updateColorPreview(this,${i})">
			B: <input type="number" min="0" max="100" value="${l.b}" style="width:50px;" onchange="layers[${i}].b=this.value;updateColorMapFromLayer(${i});updateOutput();updateColorPreview(this,${i})">
			<span class="color-preview" style="background:${hsbToHex(l.h,l.s,l.b)}"></span>
			Label: <input type="text" value="${l.label||''}" onchange="layers[${i}].label=this.value;updateColorMapFromLayer(${i});updateOutput()">
			<button onclick="removeLayer(${i})">Remove</button>
		`;
		list.appendChild(div);
	});
}

// Move updateColorMapFromLayer to global scope
function updateColorMapFromLayer(i) {
	let l = layers[i];
	let colorKey = l.name.replace('LAYER_','');
	colorValueMap[colorKey] = { h: parseInt(l.h), s: parseInt(l.s), b: parseInt(l.b) };
	colorLabelMap[colorKey] = l.label;
}
// Ensure global access for inline event handlers
window.updateColorMapFromLayer = updateColorMapFromLayer;
}
}
function renderMacroList() {
	const list = document.getElementById('macroList');
	list.innerHTML = '';
	macros.forEach((m, i) => {
		const div = document.createElement('div');
		div.className = 'item';
		div.innerHTML = `
			<b>${m.name}</b> (${m.type}) Layer: <input type="text" value="${m.layer}" onchange="macros[${i}].layer=this.value;updateOutput()">
			Color: <input type="text" value="${m.color}" onchange="macros[${i}].color=this.value;updateOutput()">
			${m.releaseColor!==undefined ? `ReleaseColor: <input type='text' value='${m.releaseColor}' onchange='macros[${i}].releaseColor=this.value;updateOutput()'>` : ''}
			<button onclick="removeMacro(${i})">Remove</button>
		`;
		list.appendChild(div);
	});
}
function renderBehaviorList() {
	const list = document.getElementById('behaviorList');
	list.innerHTML = '';
	behaviors.forEach((b, i) => {
		const div = document.createElement('div');
		div.className = 'item';
		div.innerHTML = `
			<b>${b.name}</b> Label: <input type="text" value="${b.label}" onchange="behaviors[${i}].label=this.value;updateOutput()">
			Macro: <input type="text" value="${b.macro}" onchange="behaviors[${i}].macro=this.value;updateOutput()">
			<button onclick="removeBehavior(${i})">Remove</button>
		`;
		list.appendChild(div);
	});
}
function renderComboList() {
	const list = document.getElementById('comboList');
	list.innerHTML = '';
	combos.forEach((c, i) => {
		const div = document.createElement('div');
		div.className = 'item';
		div.innerHTML = `
			<b>${c.name}</b> Bind: <input type="text" value="${c.bind}" onchange="combos[${i}].bind=this.value;updateOutput()">
			Pos: <input type="text" value="${c.pos}" onchange="combos[${i}].pos=this.value;updateOutput()">
			Layers: <input type="text" value="${c.layers}" onchange="combos[${i}].layers=this.value;updateOutput()">
			<button onclick="removeCombo(${i})">Remove</button>
		`;
		list.appendChild(div);
	});
}
function renderBlinkMacroList() {
	const list = document.getElementById('blinkMacroList');
	list.innerHTML = '';
	blinkMacros.forEach((b, i) => {
		const div = document.createElement('div');
		div.className = 'item';
		div.innerHTML = `
			<b>${b.name}</b> Key: <input type="text" value="${b.key}" onchange="blinkMacros[${i}].key=this.value;updateOutput()">
			Color: <input type="text" value="${b.color}" onchange="blinkMacros[${i}].color=this.value;updateOutput()">
			ReturnColor: <input type="text" value="${b.returnColor}" onchange="blinkMacros[${i}].returnColor=this.value;updateOutput()">
			Wait: <input type="number" value="${b.wait}" min="0" style="width:60px;" onchange="blinkMacros[${i}].wait=this.value;updateOutput()">
			<button onclick="removeBlinkMacro(${i})">Remove</button>
		`;
		list.appendChild(div);
	});
}
function updateDropdowns() {

}

// --- Add/Remove Functions ---
function addLayer() {
	const name = document.getElementById('layerName').value.trim();
	const index = document.getElementById('layerIndex').value;
	const h = parseInt(document.getElementById('hue').value);
	const s = parseInt(document.getElementById('sat').value);
	const b = parseInt(document.getElementById('bri').value);
	const label = document.getElementById('layerLabel').value.trim();
	if (!name) return;
	layers.push({ name, index, h, s, b, label });
	let colorKey = name.replace('LAYER_','');
	colorValueMap[colorKey] = { h, s, b };
	colorLabelMap[colorKey] = label;
	renderLayerList();
	updateDropdowns();
	updateOutput();
}
function removeLayer(i) {
	let l = layers[i];
	let colorKey = l.name.replace('LAYER_','');
	layers.splice(i,1);
	// Remove from colorValueMap and colorLabelMap if not an orphan color
	if (!Object.keys(colorValueMap).some(k => k !== colorKey && colorValueMap[k] && colorValueMap[k].h === l.h && colorValueMap[k].s === l.s && colorValueMap[k].b === l.b)) {
		delete colorValueMap[colorKey];
		delete colorLabelMap[colorKey];
	}
	renderLayerList();
	updateDropdowns();
	updateOutput();
}
function addMacro() {
	const type = document.getElementById('macroType').value;
	const name = document.getElementById('macroName').value.trim();
	const layer = document.getElementById('macroLayer').value;
	const color = document.getElementById('macroColor').value;
	const releaseColor = document.getElementById('macroReleaseColor').value;
	if (!name) return;
	macros.push({ name, type, layer, color, releaseColor });
	renderMacroList();
	updateDropdowns();
	updateOutput();
}
function removeMacro(i) {
	macros.splice(i,1);
	renderMacroList();
	updateDropdowns();
	updateOutput();
}
function addBehavior() {
	const name = document.getElementById('behaviorName').value.trim();
	const label = document.getElementById('behaviorLabel').value.trim();
	const macro = document.getElementById('behaviorMacro').value;
	if (!name) return;
	behaviors.push({ name, label, macro });
	renderBehaviorList();
	updateDropdowns();
	updateOutput();
}
function removeBehavior(i) {
	behaviors.splice(i,1);
	renderBehaviorList();
	updateDropdowns();
	updateOutput();
}
function addCombo() {
	const name = document.getElementById('comboName').value.trim();
	const bind = document.getElementById('comboBind').value.trim();
	const pos = document.getElementById('comboPos').value.trim();
	const layersSel = Array.from(document.getElementById('comboLayers').selectedOptions).map(o=>o.value).join(',');
	if (!name) return;
	combos.push({ name, bind, pos, layers: layersSel });
	renderComboList();
	updateDropdowns();
	updateOutput();
}
function removeCombo(i) {
	combos.splice(i,1);
	renderComboList();
	updateDropdowns();
	updateOutput();
}
function addBlinkMacro() {
	const name = document.getElementById('blinkName').value.trim();
	const key = document.getElementById('blinkKey').value.trim();
	const color = document.getElementById('blinkColor').value;
	const returnColor = document.getElementById('blinkReturnColor').value;
	const wait = parseInt(document.getElementById('blinkWait').value);
	if (!name) return;
	blinkMacros.push({ name, key, color, returnColor, wait });
	renderBlinkMacroList();
	updateDropdowns();
	updateOutput();
}
function removeBlinkMacro(i) {
	blinkMacros.splice(i,1);
	renderBlinkMacroList();
	updateDropdowns();
	updateOutput();
}

// --- Output Generation ---
function updateOutput() {
	let out = `/*\n * Generated Modular RGB Layer Template for ZMK\n *\n * Copy this file and fill in your own layers, colors, macros, and behaviors.\n * All sections are commented for easy customization.\n */\n\n/* ---- STEP 1: DEFINE LAYERS ---- */\n`;
	// Output all layers and their associated RGB_ defines if both exist
	const outputColorKeys = new Set();
	layers.forEach(l => {
		if (l.index !== '') out += `#define ${l.name} ${l.index}\n`;
		// Always output RGB_<NAME> for each layer
		let colorKey = l.name.replace('LAYER_','');
		let label = l.label ? ` // ${l.label}` : '';
		if (l.h !== '' && l.s !== '' && l.b !== '') {
			out += `#define RGB_${colorKey} RGB_COLOR_HSB(${l.h},${l.s},${l.b})${label}\n`;
			outputColorKeys.add(colorKey);
		}
	});
	out += `\n/* ---- STEP 1a: DEFINE COLORS ---- */\n`;
	// Output all other color defines (orphans and non-layer colors)
	Object.keys(colorValueMap).forEach(colorKey => {
		if (!outputColorKeys.has(colorKey)) {
			let v = colorValueMap[colorKey];
			let label = colorLabelMap[colorKey] ? ` // ${colorLabelMap[colorKey]}` : '';
			out += `#define ${colorKey} RGB_COLOR_HSB(${v.h},${v.s},${v.b})${label}\n`;
			outputColorKeys.add(colorKey);
		}
	});
	out += `\n/* ---- MACROS ---- */\n`;
	macros.forEach(m => {
		if (m.type === 'TO_RGB_MACRO') {
			out += `TO_RGB_MACRO(${m.name}, ${m.layer}, ${m.color})\n`;
		} else if (m.type === 'MOMENTARY_RGB_MACRO') {
			out += `MOMENTARY_RGB_MACRO(${m.name}, ${m.layer}, ${m.color}, ${m.releaseColor})\n`;
		} else if (m.type === 'TO_RGB_PRESS_MACRO') {
			out += `TO_RGB_PRESS_MACRO(${m.name}, ${m.layer}, ${m.color})\n`;
		}
	});
	out += `\n/* ---- (OPTIONAL) BLINK/STATUS MACROS ---- */\n`;
	blinkMacros.forEach(b => {
		out += `ZMK_MACRO(${b.name}, &kp ${b.key}, BLINK_SEQ(${b.color}, ${b.returnColor}, ${b.wait}))\n`;
	});
	out += `\n/* ---- BEHAVIORS - HOLD-TAP ---- */\n`;
	behaviors.forEach(b => {
		out += `RGB_HOLD_TAP(${b.name}, "${b.label}", ${b.macro})\n`;
	});
	out += `\n/* ---- COMBOS ---- */\n`;
	combos.forEach(c => {
		out += `COMBO(${c.name}, ${c.bind}, ${c.pos}, ${c.layers})\n`;
	});
	document.getElementById('output').value = out.trim();
}

// --- Color Input Sync ---
function syncColorInputs() {
	const h = document.getElementById('hue');
	const s = document.getElementById('sat');
	const b = document.getElementById('bri');
	const hNum = document.getElementById('hueNum');
	const sNum = document.getElementById('satNum');
	const bNum = document.getElementById('briNum');
	const colorWheel = document.getElementById('colorWheel');
	const preview = document.getElementById('colorPreview');
	function updateAll() {
		hNum.value = h.value; sNum.value = s.value; bNum.value = b.value;
		colorWheel.value = hsbToHex(h.value, s.value, b.value);
		preview.style.background = colorWheel.value;
	}
	h.oninput = ()=>{ hNum.value=h.value; updateAll(); };
	s.oninput = ()=>{ sNum.value=s.value; updateAll(); };
	b.oninput = ()=>{ bNum.value=b.value; updateAll(); };
	hNum.oninput = ()=>{ h.value=hNum.value; updateAll(); };
	sNum.oninput = ()=>{ s.value=sNum.value; updateAll(); };
	bNum.oninput = ()=>{ b.value=bNum.value; updateAll(); };
	colorWheel.oninput = ()=>{
		// Convert hex to HSB (approx)
		let hex = colorWheel.value;
		let r = parseInt(hex.substr(1,2),16), g = parseInt(hex.substr(3,2),16), bl = parseInt(hex.substr(5,2),16);
		let mx = Math.max(r,g,bl), mn = Math.min(r,g,bl);
		let h = 0, s = 0, v = mx/255;
		let d = mx - mn;
		if (mx !== 0) s = d/mx;
		if (mx === mn) h = 0;
		else if (mx === r) h = (60 * ((g-bl)/d) + 360) % 360;
		else if (mx === g) h = (60 * ((bl-r)/d) + 120) % 360;
		else if (mx === bl) h = (60 * ((r-g)/d) + 240) % 360;
		document.getElementById('hue').value = Math.round(h);
		document.getElementById('sat').value = Math.round(s*100);
		document.getElementById('bri').value = Math.round(v*100);
		updateAll();
	};
	updateAll();
}
